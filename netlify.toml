[build]
functions = "netlify/functions"

[[redirects]]
from = "/blog.html"
to = "/blog"
status = 301
force = true

[[redirects]]
from = "/blog"
to = "/blog.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
